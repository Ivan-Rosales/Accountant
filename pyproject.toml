[project]
name = "accountant"
version = "1.6.2"
description = "accountant"
authors = [
    {name = "Ivan-Rosales",email = "61328655+Ivan-Rosales@users.noreply.github.com"}
]
readme = "README.md"
requires-python = "<3.15,>=3.14"
dependencies = [
    "pyside6 (>=6.11.0,<7.0.0)",
    "pysidesix-frameless-window (>=0.8.1,<0.9.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "toml (>=0.10.2,<0.11.0)",
    "requests (>=2.33.1,<3.0.0)",
    "defusedxml (>=0.7.1,<0.8.0)",
    "keyring (>=25.7.0,<26.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.19.0"
pytest = "^9.2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

